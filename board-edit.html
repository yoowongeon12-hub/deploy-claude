<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 수정</title>
    <link rel="stylesheet" href="style/board-write.css">
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <header class="header">
            <div class="header-back">
                <a href="#" class="btn-back" id="btn-back">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                    돌아가기
                </a>
            </div>
            <h1>게시글 수정</h1>
            <p class="header-description">게시글의 내용을 수정하세요</p>
        </header>

        <!-- 게시글 수정 폼 -->
        <div class="form-container">
            <!-- 제목 입력 필드 -->
            <div class="form-group">
                <label for="post-title">제목 <span class="required">*</span></label>
                <div class="input-wrapper">
                    <input type="text" id="post-title" class="form-input" placeholder="제목을 입력하세요 (1~200자)" maxlength="200">
                    <span class="input-char-count"><span id="title-count">0</span>/200</span>
                </div>
            </div>

            <!-- 내용 입력 필드 -->
            <div class="form-group">
                <label for="post-content">내용 <span class="required">*</span></label>
                <div class="textarea-wrapper">
                    <textarea id="post-content" class="form-input form-textarea" placeholder="내용을 입력하세요 (1~10000자)" maxlength="10000"></textarea>
                    <span class="textarea-char-count"><span id="content-count">0</span>/10000</span>
                </div>
            </div>

            <!-- 작성자명 입력 필드 (읽기 전용) -->
            <div class="form-group">
                <label for="post-author">작성자명</label>
                <input type="text" id="post-author" class="form-input form-input-readonly" placeholder="작성자명" readonly>
                <small class="input-hint">작성자명은 수정할 수 없습니다</small>
            </div>

            <!-- 폼 액션 버튼 -->
            <div class="form-actions">
                <button id="btn-cancel" class="btn btn-secondary">취소</button>
                <button id="btn-save" class="btn btn-primary">수정 완료</button>
            </div>
        </div>
    </div>

    <script src="js/board-edit.js"></script>
</body>
</html>
