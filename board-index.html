<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판</title>
    <link rel="stylesheet" href="style/board-index.css">
</head>
<body>
    <div class="container">
        <!-- 헤더 영역: 제목과 CTA -->
        <header class="header">
            <div class="header-content">
                <h1 class="header-title">커뮤니티 게시판</h1>
                <p class="header-subtitle">다양한 의견과 정보를 공유하는 공간입니다</p>
            </div>
            <a href="board-write.html" class="btn-primary-cta">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                새 글쓰기
            </a>
        </header>

        <!-- 검색 및 필터 영역 -->
        <div class="controls-section">
            <div class="search-box">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input type="text" id="search-input" class="search-input" placeholder="게시글 검색...">
            </div>
            <div class="category-filter">
                <button class="category-badge active" data-filter="all">전체</button>
                <button class="category-badge" data-filter="notice">🔔 공지</button>
                <button class="category-badge" data-filter="free">💬 자유</button>
                <button class="category-badge" data-filter="qna">❓ Q&A</button>
                <button class="category-badge" data-filter="popular">⭐ 인기</button>
            </div>
        </div>

        <!-- 게시글 목록 - 카드 그리드 레이아웃 -->
        <main class="board-list">
            <div id="post-list" class="posts-grid">
                <!-- 동적으로 생성될 게시글 카드 목록 -->
            </div>
            <div class="empty-state" id="no-posts" style="display: none;">
                <div class="empty-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4" />
                    </svg>
                </div>
                <p class="empty-text">아직 게시글이 없습니다</p>
                <a href="board-write.html" class="empty-cta">첫 게시글 작성하기</a>
            </div>
        </main>

        <!-- 페이지네이션 -->
        <div class="pagination-section">
            <button class="pagination-btn prev-btn" aria-label="이전 페이지">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            <div class="page-numbers" id="page-numbers"></div>
            <button class="pagination-btn next-btn" aria-label="다음 페이지">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </div>

    <script src="js/board-index.js"></script>
</body>
</html>
