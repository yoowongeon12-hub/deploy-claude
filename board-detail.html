<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 상세보기</title>
    <link rel="stylesheet" href="style/board-detail.css">
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <header class="header">
            <a href="board-index.html" class="btn-back">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                목록으로
            </a>
        </header>

        <!-- 게시글 상세 내용 -->
        <article class="post-detail">
            <div class="post-header">
                <h1 id="post-title" class="post-title"></h1>
                <div class="post-meta">
                    <span id="post-author" class="post-meta-item">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                        <span id="post-author-text"></span>
                    </span>
                    <span id="post-date" class="post-meta-item">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <span id="post-date-text"></span>
                    </span>
                    <span id="post-views" class="post-meta-item">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <span id="post-views-text"></span>
                    </span>
                </div>
            </div>

            <div class="post-divider"></div>

            <div class="post-content" id="post-content"></div>

            <div class="post-actions">
                <button id="btn-delete" class="btn btn-danger">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                    삭제
                </button>
                <a href="#" id="btn-edit" class="btn btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                    </svg>
                    수정
                </a>
            </div>
        </article>

        <!-- 댓글 섹션 -->
        <section class="comments-section">
            <div class="comments-header">
                <h3>댓글 <span class="comment-badge" id="comment-count">0</span></h3>
            </div>

            <!-- 댓글 입력 폼 -->
            <div class="comment-form">
                <textarea id="comment-input" class="comment-input" placeholder="예의 있는 댓글로 소통해보세요..."></textarea>
                <div class="comment-form-actions">
                    <span class="comment-char-count"><span id="comment-char">0</span>/500</span>
                    <button id="btn-comment-submit" class="btn btn-primary">등록</button>
                </div>
            </div>

            <!-- 댓글 목록 -->
            <div class="comment-list" id="comment-list">
                <!-- 동적으로 생성될 댓글 목록 -->
            </div>

            <div class="no-comments" id="no-comments">
                <p>첫 번째 댓글을 남겨보세요!</p>
            </div>
        </section>
    </div>

    <script src="js/board-detail.js"></script>
</body>
</html>
