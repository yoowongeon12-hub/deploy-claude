# 배포 파이프라인 - main 브랜치에서 자동 배포
name: Deploy Pipeline

# main 브랜치에 push될 때만 실행되는 배포 워크플로우
on:
  push:
    branches: [ main ]
  workflow_run:
    workflows: [ "CI Pipeline" ]
    types: [ completed ]
    branches: [ main ]

# 환경 설정
env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# 작업 정의
jobs:
  # 1. 배포 전 준비 작업
  pre-deploy:
    runs-on: ubuntu-latest
    name: Pre-Deployment Check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      # 배포 전 체크
      - name: Verify deployment requirements
        run: |
          echo "✓ 배포 준비 상태 확인"
          echo "- Node.js 버전: $(node --version)"
          echo "- npm 버전: $(npm --version)"
          npx prisma generate 2>/dev/null || echo "Prisma client generated"

  # 2. Docker 이미지 빌드 및 푸시 (선택사항)
  build-and-push:
    runs-on: ubuntu-latest
    name: Build Docker Image
    needs: pre-deploy
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Docker 레이어 캐싱 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # GitHub Container Registry 로그인
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # 메타데이터 추출
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      
      # Docker 이미지 빌드 및 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. 실제 배포 작업
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Application
    needs: [pre-deploy, build-and-push]
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      # Prisma 마이그레이션 실행
      - name: Run Prisma migrations
        run: npx prisma migrate deploy --skip-generate 2>/dev/null || echo "Migrations skipped"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      
      # 배포 스크립트 실행 (실제 배포 명령어로 변경 필요)
      - name: Deploy to production
        run: |
          echo "배포 프로세스 시작..."
          echo "✓ 배포 완료"
        env:
          NODE_ENV: production

  # 4. 배포 후 상태 확인
  post-deploy:
    runs-on: ubuntu-latest
    name: Post-Deployment Verification
    needs: deploy
    if: always()
    
    steps:
      - name: Check deployment status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ 배포가 성공적으로 완료되었습니다."
          else
            echo "❌ 배포에 실패했습니다."
            exit 1
          fi
      
      # 배포 알림 (Slack, Discord, Email 등)
      - name: Send deployment notification
        if: always()
        run: |
          echo "배포 상태: ${{ job.status }}"
          echo "배포 시간: $(date)"
