# CI/CD 파이프라인 - 자동 테스트 및 검증
name: CI Pipeline

# 이 워크플로우는 main 브랜치에 push될 때 또는 PR이 생성될 때 실행됨
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# 환경 변수 설정
env:
  NODE_VERSION: '18'
  NPM_VERSION: '10'

# 작업(jobs) 정의
jobs:
  # 1. 코드 체크 작업
  code-check:
    runs-on: ubuntu-latest
    name: Code Quality Check

    steps:
      # 저장소 코드를 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # Node.js 환경 설정
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 의존성 설치
      - name: Install dependencies
        run: npm install

      # ESLint를 사용한 코드 품질 검사 (선택사항)
      - name: Run linter
        run: npm run lint 2>/dev/null || echo "No lint script configured"

      # 코드 형식 검사 (prettier 사용, 선택사항)
      - name: Check code formatting
        run: npm run format:check 2>/dev/null || echo "No format check script configured"

  # 2. 유닛 테스트 실행
  test:
    runs-on: ubuntu-latest
    name: Unit Tests
    needs: code-check

    services:
      # PostgreSQL 데이터베이스 서비스
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # 환경 변수 설정
      - name: Create .env.test
        run: |
          echo "NODE_ENV=test" > .env.test
          echo "DATABASE_URL=postgresql://test_user:test_password@localhost:5432/test_db" >> .env.test
          echo "PORT=3001" >> .env.test

      # Prisma 마이그레이션 실행
      - name: Run Prisma migrations
        run: npx prisma migrate deploy --skip-generate 2>/dev/null || echo "No migrations to run"
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db

      # 테스트 실행
      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db

  # 3. 보안 취약점 검사
  security:
    runs-on: ubuntu-latest
    name: Security Scan
    needs: code-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # npm audit를 사용한 보안 취약점 검사
      - name: Run npm audit
        run: npm audit --audit-level=moderate

  # 4. 빌드 검증
  build:
    runs-on: ubuntu-latest
    name: Build Verification
    needs: [code-check, test, security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Prisma 클라이언트 생성
      - name: Generate Prisma Client
        run: npx prisma generate 2>/dev/null || echo "Prisma client already generated"

      # 빌드 가능성 확인
      - name: Verify build integrity
        run: |
          node -c api-server.js
          echo "✓ 빌드 검증 완료"

  # 5. 결과 리포트
  report:
    runs-on: ubuntu-latest
    name: Test Report
    needs: [code-check, test, build]
    if: always()

    steps:
      - name: Check job status
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ 모든 CI 검사를 통과했습니다."
          else
            echo "❌ CI 검사에 실패했습니다."
            exit 1
          fi
